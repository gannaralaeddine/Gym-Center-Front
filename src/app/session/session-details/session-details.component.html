


    <div class="styles">
      <div class="blog_item_img">
        <img class="card-img" [src]="getImage(session.sessionImage)" height="450px" alt="">
        <div class="blog_item_date">
          <h3>{{ session.sessionDeadline | date:"dd MMM yyyy à hh:mm" }}</h3>
        </div>
        <div class="blog_item_coach">
            <h3> Coach: {{ session.sessionCoach.userFirstName }} {{ session.sessionCoach.userLastName }}</h3>
        </div>
        <button class="btn-participate btn-hover blog_item_coach-btn" (click)="participateToSession(session)" *ngIf="userIsLoggedIn">Se participer</button>
      </div>
      <div class="details_blog" style="background-color: #0b0b0b">
        <h1 class="text-white" >{{ session.sessionName }}</h1>
        <p class="text-white text-size">{{ session.sessionDescription }}</p>
      </div>
    </div>
