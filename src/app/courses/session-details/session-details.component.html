


    <div class="styles">
      <div class="blog_item_img">
        <img class="card-img" [src]="getImage(session.sessionImage)" height="450px" alt="">
        <div class="blog_item_date">
          <h3>{{ session.sessionDeadline | date:"dd MMM yyyy à hh:mm" }}</h3>
        </div>
      </div>
      <div class="details_blog">
        <h1 class="text-white" >{{ session.sessionName }}</h1>
        <p class="text-white">{{ session.sessionDescription }}</p>
      </div>
    </div>
