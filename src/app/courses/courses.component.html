

  <div class="slider-area2">
    <div class="slider-height2 d-flex align-items-center">
      <div class="container">
        <div class="row">
          <div class="col-xl-12">
            <div class="hero-cap hero-cap2 pt-70">
              <h2>Nos Classes</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="traning-categories black-bg">
    <div class="container-fluid">
      <div class="row">
        <div>
          <div class="single-topic text-center mb-30">
            <div class="topic-img">
              <img src="assets/img/gallery/cat2.png" alt="">
              <div class="topic-content-box">
                <div class="topic-content">
                  <h3>Formation de groupe</h3>
                  <p>You’ll look at graphs and charts in Task One, how to approach the task and <br> the language needed for a successful answer.</p>
                </div>
              </div>
            </div>
          </div>
        </div >
      </div>
    </div>
  </section>

  <section class="team-area fix">
    <div class="container">
      <div class="row">

        <mat-grid-list cols="4" rowHeight="1:2" >
          <mat-grid-tile *ngFor="let session of sessions">

            <div class="single-cat text-center mb-30 wow fadeInUp" data-wow-duration="1s" data-wow-delay=".2s"  >
              <div class="cat-icon">
                <img [src]="getImage(session.sessionImage)" width="320" height="430" alt="">
              </div>
              <div class="cat-cap">
                <h5><a href="#">{{ session.sessionName }}</a></h5>
              </div>
              <div class="text-white">
                <h4><a href="#">Coach {{ session.sessionCoach.userFirstName }} {{ session.sessionCoach.userLastName }}</a></h4>
              </div>
              <a href="#" class="border-btn border-btn2 mt-10">Détails</a>
            </div>

          </mat-grid-tile>
        </mat-grid-list>
      </div>
    </div>
  </section>
