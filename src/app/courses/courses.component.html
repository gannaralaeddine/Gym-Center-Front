

  <div class="slider-area2">
    <div class="slider-height2 d-flex align-items-center">
      <div class="container">
        <div class="row">
          <div class="col-xl-12">
            <div class="hero-cap hero-cap2 pt-70">
              <h2>Nos Classes</h2>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="traning-categories black-bg">
    <div class="container-fluid">
      <div class="row">
        <div>
          <div class="single-topic text-center mb-30">
            <div class="topic-img">
              <img src="assets/img/gallery/cat2.png" alt="">
              <div class="topic-content-box">
                <div class="topic-content">
                  <h3>Formation de groupe</h3>
                  <p>You’ll look at graphs and charts in Task One, how to approach the task and <br> the language needed for a successful answer.</p>
                </div>
              </div>
            </div>
          </div>
        </div >
      </div>
    </div>
  </section>


  <section class="blog_area section-padding">
    <div class="container">
      <div class="row">

        <article class="blog_item" *ngFor="let session of sessions">
          <div class="blog_item_img">
            <img class="card-img rounded-0" [src]="getImage(session.sessionImage)" width="1000" height="650" alt="">
            <div class="blog_item_date">
              <h3>{{ session.sessionDeadline | date:"dd MMM yyyy" }}</h3>
            </div>
          </div>
          <div class="blog_details">
            <a class="d-inline-block">
              <h1 class="blog-head" style="color: #fff;">{{ session.sessionName }}</h1>
            </a>
            <p style="color: #fff;">>{{ session.sessionDescription }}</p>
          </div>
        </article>

      </div>
    </div>
  </section>
