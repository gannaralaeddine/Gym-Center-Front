
  
    <div class="slider-area2">
      <div class="slider-height2 d-flex align-items-center">
        <div class="container">
          <div class="row">
            <div class="col-xl-12">
              <div class="hero-cap hero-cap2 pt-70">
                <h2>détails catégorie</h2>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
 
    <section class=" white-bg single-post-area section-padding ">
     <div class="container">
        <div class="row">
            <div class="posts-list">
                <div class="single-post">
                    <div class="feature-img" style="text-align: center;">
                        <img class="img-fluid" [src]="getImage(category.catImage)" width="90%" height="60%" alt="image catégorie">
                    </div>
    
                    <div class="blog_details">
                        <h2 style="color: #2d2d2d; margin-left: 3%;">Catégorie: {{category.catName}}</h2>
                    </div>

                    <div class="row">
                        <h2  style="margin-left: 2.7%; margin-top: 1.5%;">Description:</h2>
                        <h3 style="font-style: italic; font-family: Arial, Helvetica, sans-serif; margin-left: 2.7%; margin-top: 1%;">{{category.catDescription}}</h3>
                    </div>
                </div>
            </div>
        </div>

            <!-- <div class="card" style="width: 14rem; margin-top: 5%;" *ngFor="let activity of categoryActivities">
              <img class="card-img-top" [src]="getImage(activity.actImage)" height="150" width="288" alt="Card image cap" (click)="goToActivityDetails(activity.actId)">
              <div class="card-body">
                <a class="card-text" href="javascript:" (click)="goToActivityDetails(activity.actId)"><h3 class="text-center">{{activity.actName}}</h3></a>
              </div>
            </div> -->

            <mat-grid-list cols="4" rowHeight="40rem">
                <mat-grid-tile *ngFor="let activity of categoryActivities">
        
                  <div class="single-cat text-center wow fadeInUp mr-10" data-wow-duration="1s" data-wow-delay=".2s">
                    <div class="cat-icon" style="padding-left: 2%;">
                      <img [src]="getImage(activity.actImage)" width="430" height="320" alt="">
                    </div>
                    <div class="cat-cap" style="padding-bottom: 5%;">
                      <h5><a href="javascript:" (click)="goToActivityDetails(activity.actId)" style="font-size: large;">{{ activity.actName }}</a></h5>
                    </div>
                  </div>
        
                </mat-grid-tile>
              </mat-grid-list>

    </div>
  </section>
