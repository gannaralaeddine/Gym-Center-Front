<div class="slider-area2">
    <div class="slider-height2 d-flex align-items-center">
        <div class="container">
            <div class="row">
              <div class="col-xl-12">
                <div class="hero-cap hero-cap2 pt-70">
                  <h2>détails activité</h2>
                </div>
              </div>
            </div>
        </div>
    </div>
</div>
   
<section class=" white-bg single-post-area section-padding ">
    <div class="container">
        <div class="row">
            <div class="posts-list">
                <div class="single-post">
                    <div class="feature-img" style="text-align: center;">
                        <img class="img-fluid" [src]="getImage(activity.actImage)" width="90%" height="60%" alt="image activité">
                    </div>
      
                    <div class="blog_details">
                        <h2 style="color: #2d2d2d; margin-left: 3%;">Activité: {{activity.actName}}</h2>
                    </div>
  
                    <div class="row">
                        <h2  style="margin-left: 2.7%; margin-top: 1.5%;">Description:</h2>
                        <h3 style="font-style: italic; font-family: Arial, Helvetica, sans-serif; margin-left: 2.7%; margin-top: 1%;">{{activity.actDescription}}</h3>
                    </div>
                </div>
            </div>
        </div>

        <h2 style="color: #2d2d2d; margin-left: 3%; margin-top: 5%;">Catégorie:</h2>
        <div class="single-cat text-center wow fadeInUp mr-10" data-wow-duration="1s" data-wow-delay=".2s" style ="margin-top: 2%;">
            <div class="cat-icon" style="padding-left: 2%;">
                <img [src]="getImage(activity.category.catImage)" width="430" height="320" alt="" class="cursor-pointer" (click)="goToCategoryDetails(activity.category.catId)">
            </div>
            <div class="cat-cap" style="padding-bottom: 5%; padding-top: 1%;">
                <h3 (click)="goToCategoryDetails(activity.category.catId)" class="cursor-pointer" style="font-size: large;">{{ activity.category.catName }}</h3>
            </div>
        </div>

        <h2 style="color: #2d2d2d; margin-left: 3%; margin-bottom: 3%;">Coaches:</h2>

        <div class="d-flex justify-content-center" *ngIf="!activity.actCoaches || activity.actCoaches.length == 0">
            <h2 class="text-center">Il n'y a pas encore des coaches disponibles</h2>
        </div>

        <mat-grid-list cols="4" rowHeight="40rem" style="margin-left: 3%;" *ngIf="activity.actCoaches">
            <mat-grid-tile *ngFor="let coach of activity.actCoaches">
              <div class="single-cat text-center wow fadeInUp mr-10" data-wow-duration="1s" data-wow-delay=".2s">
                <div class="cat-icon" style="padding-left: 2%;">
                  <img [src]="getImage(coach.userPicture)" width="430" height="320" alt="" class="cursor-pointer" (click)="goToCoachProfile(coach)">
                </div>
                <div class="cat-cap" style="padding-bottom: 5%; padding-top: 5%;">
                  <h3 (click)="goToCoachProfile(coach)" class="cursor-pointer" style="font-size: large;">{{coach.userFirstName}} {{coach.userLastName}}</h3>
                </div>
              </div>
            </mat-grid-tile>
        </mat-grid-list>

    </div>
</section>
